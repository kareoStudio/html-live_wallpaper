name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          if [ -f "html-live-wallpaper.zip" ]; then
            unzip "html-live-wallpaper.zip" -d extracted/
          else
            ZIP_FILE=$(find . -name "*.zip" | head -1)
            unzip "$ZIP_FILE" -d extracted/
          fi
          
          PROJECT_DIR=$(find extracted/ -name "settings.gradle.kts" | head -1 | xargs dirname)
          cp -r "$PROJECT_DIR"/* . 2>/dev/null || true
          cp -r "$PROJECT_DIR"/.* . 2>/dev/null || true
          
          rm -rf extracted/ *.zip
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
