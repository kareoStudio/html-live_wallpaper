name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          echo "=== All files in repo ==="
          ls -la
          
          echo "=== Searching for ZIP files ==="
          find . -name "*.zip" -o -name "*.ZIP"
          
          echo "=== Trying direct filename ==="
          if [ -f "html-live-wallpaper.zip" ]; then
            echo "Found: html-live-wallpaper.zip"
            unzip "html-live-wallpaper.zip" -d extracted/
          else
            echo "Direct file not found, trying find..."
            ZIP_FILE=$(find . -name "*.zip" | head -1)
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No ZIP file found anywhere!"
              exit 1
            fi
            echo "Found via find: $ZIP_FILE"
            unzip "$ZIP_FILE" -d extracted/
          fi
          
          echo "=== Extracted contents ==="
          ls -la extracted/
          
          echo "=== Moving files to root ==="
          # Check nested folder
          NESTED=$(find extracted/ -mindepth 1 -maxdepth 1 -type d | head -1)
          if [ -n "$NESTED" ]; then
            echo "Moving from nested: $NESTED"
            mv "$NESTED"/* . 2>/dev/null || true
            mv "$NESTED"/.* . 2>/dev/null || true
          else
            mv extracted/* . 2>/dev/null || true
            mv extracted/.* . 2>/dev/null || true
          fi
          
          rm -rf extracted/
          rm -f *.zip
          
          echo "=== Final files ==="
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found!"
            ls -la
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
