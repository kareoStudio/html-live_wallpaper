name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          echo "=== All files ==="
          ls -la
          
          echo "=== Finding ZIP ==="
          if [ -f "html-live-wallpaper.zip" ]; then
            unzip "html-live-wallpaper.zip" -d extracted/
          else
            ZIP_FILE=$(find . -name "*.zip" | head -1)
            unzip "$ZIP_FILE" -d extracted/
          fi
          
          echo "=== Extracted ==="
          ls -la extracted/
          
          echo "=== Moving to root ==="
          NESTED=$(find extracted/ -mindepth 1 -maxdepth 1 -type d | head -1)
          if [ -n "$NESTED" ]; then
            mv "$NESTED"/* . 2>/dev/null || true
            mv "$NESTED"/.* . 2>/dev/null || true
          else
            mv extracted/* . 2>/dev/null || true
          fi
          
          rm -rf extracted/ *.zip
          
          echo "=== Final structure ==="
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper (if missing)
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
