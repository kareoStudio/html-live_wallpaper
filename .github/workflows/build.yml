name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          echo "=== Files before extract ==="
          ls -la
          
          echo "=== Extracting ZIP ==="
          if [ -f "html-live-wallpaper.zip" ]; then
            unzip "html-live-wallpaper.zip" -d extracted/
          else
            ZIP_FILE=$(find . -name "*.zip" | head -1)
            unzip "$ZIP_FILE" -d extracted/
          fi
          
          echo "=== Extracted contents ==="
          ls -la extracted/
          
          echo "=== Finding project folder ==="
          # Find the folder that has settings.gradle.kts
          PROJECT_DIR=$(find extracted/ -name "settings.gradle.kts" | head -1 | xargs dirname)
          echo "Project folder: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          
          echo "=== Copying ALL files to root ==="
          # Use cp -r to properly copy everything including subdirectories
          cp -r "$PROJECT_DIR"/* . 2>/dev/null || true
          cp -r "$PROJECT_DIR"/.* . 2>/dev/null || true
          
          echo "=== Cleanup ==="
          rm -rf extracted/ *.zip
          
          echo "=== Final structure ==="
          ls -la
          echo "=== gradle folder ==="
          ls -la gradle/
          echo "=== libs.versions.toml ==="
          cat gradle/libs.versions.toml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Generating gradlew..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
