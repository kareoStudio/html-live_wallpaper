name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          # Find the ZIP file
          ZIP_FILE=$(find . -name "*.zip" | head -1)
          echo "Found ZIP: $ZIP_FILE"
          
          # Extract it
          unzip "$ZIP_FILE" -d extracted/
          
          # Show what was extracted
          ls -la extracted/
          
          # Move files from nested folder to root (if needed)
          if [ -d "extracted/html-live-wallpaper" ]; then
            mv extracted/html-live-wallpaper/* .
            mv extracted/html-live-wallpaper/.* . 2>/dev/null || true
          else
            mv extracted/* .
            mv extracted/.* . 2>/dev/null || true
          fi
          
          # Clean up
          rm -rf extracted/
          rm -f "$ZIP_FILE"
          
          # Show final structure
          echo "Final structure:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app
